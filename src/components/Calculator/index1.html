<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator Layout</title>
  <link rel="stylesheet" href="index1.css">
</head>
<body>
  <div class="calculator">
    <div class="display" id ="number0">0</div>
    <div class="buttons">
      <button>MC</button>
      <button>MR</button>
      <button>M+</button>
      <button>M-</button>
      <button id = "clear" >C</button>

      <button id = "number7">7</button>
      <button id = "number8">8</button>
      <button id = "number9">9</button>
      <button class="operator">÷</button>

      <button id = "number4">4</button>
      <button id = "number5">5</button>
      <button id = "number6">6</button>
      <button class="operator">×</button>

      <button id = "number1">1</button>
      <button id = "number2">2</button>
      <button id = "number3">3</button>
      <button class="operator">-</button>

      <button id = "number0">0</button>
      <button>.</button>
      <button class="operator">+</button>
      <button class="equal" onclick="equal()">=</button>
    </div>
  </div>

  <script src="index1.js"></script>
</body>
</html>
