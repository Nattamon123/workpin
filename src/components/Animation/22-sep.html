<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .container {
            margin: auto;
            width: fit-content;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #000000
        }
         .box {
            border: 1px solid #000000;
            width: auto;
            height: 400px;
            margin-bottom: 1rem;
            background-image: url('https://img.freepik.com/premium-photo/wood-wall-text-background_1249-786.jpg');
            background-size: cover;
            background-position: center;;
        }
        .control {
            text-align: center;
        }
        .ball {
            display: flex;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 1px solid #000000;
          /* left: calc(800px-150px); */
            justify-content: center;
            background-size: cover;
            position: relative;
        }
        .active {
background-color: rgb(14, 14, 15);
transition: background-color 0.3s;
}
    </style>
</head>
<body>
    <div id = "container"class="container">
        <div class="box">
            <div id = "ball"class="ball">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center w-100">
            <button onclick='clicked()' class="btn btn-success" id="run-Btn">Run</button>
            <div class="d-flex">
                <button class="btn btn-outline-secondary ball-btn">non</button>
                <button class="btn btn-outline-primary ball-btn">BasketBall</button>
                <button class="btn btn-outline-primary ball-btn">FootBall</button>
                <button class="btn btn-outline-primary ball-btn">VolleyBall</button>
                <button class="btn btn-outline-primary ball-btn">Human</button>
                <button class="btn btn-outline-primary ball-btn">Cartoon</button>
            </div>
        </div> 
    </div>
    <script src = '22-sep.js'></script>
</body>
</html>
